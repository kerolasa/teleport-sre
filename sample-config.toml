# Log level can be one of: trace debug info warn error fatal panic
loglevel = "debug"

# The largest number of replicas an update is allowed to scale a deployment
# to.  A negative value makes kubernetes cluster to choose upper limit.
max_replicas = 100

[api]
    host = "0.0.0.0"
    port = 8443
    prefix = "/"

[metrics]
    host = "127.0.0.1"
    port = 9443
    path = "/metrics"

# The keys and the certificates the api server terminates TLS with, which
# `make certs` creates in ./certs directory.
[tls]
    ca = "certs/ca.crt"
    cert = "certs/server.crt"
    key = "certs/server.key"

# How the service reaches the kubernetes api server.  With both values left
# empty it connects the way kubectl does: the service account of the pod it
# runs in, and failing that the kubeconfig of the current user, which is
# KUBECONFIG or ~/.kube/config.  That is what makes a local kind cluster work.
[kube]
    # Path of the kubeconfig to authenticate with.  A leading tilde is expanded.
    #kubeconfig = "~/.kube/config"

    # Kubeconfig context to use, defaults to the current context of the
    # kubeconfig.
    #context = "kind-kind"
